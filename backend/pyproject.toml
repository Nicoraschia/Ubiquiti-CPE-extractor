[project]
name = "cpe-scanner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "paramiko>=3.5,<4",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.32",
]

[project.scripts]
cpe-scanner = "cpe_scanner:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# El .pth del install editable queda con flag "hidden" en macOS y Python lo ignora.
pythonpath = ["src", "tests"]
markers = ["db: necesita Postgres (DATABASE_URL)"]

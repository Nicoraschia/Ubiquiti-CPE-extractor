[project]
name = "cpe-scanner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paramiko>=3.5,<4",
]

[project.scripts]
cpe-scanner = "cpe_scanner:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# El .pth del install editable queda con flag "hidden" en macOS y Python lo ignora.
pythonpath = ["src"]

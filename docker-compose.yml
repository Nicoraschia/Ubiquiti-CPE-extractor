name: cpe-scanner

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin puertos publicados: solo accesible desde la red interna de compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Herramienta de linea de comandos: `docker compose run --rm scanner <comando>`.
  # El profile evita que `up -d` la arranque como servicio.
  scanner:
    build: ./backend
    profiles: ["cli"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SCAN_USER: ${SCAN_USER:-}
      SCAN_PASSWORD: ${SCAN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

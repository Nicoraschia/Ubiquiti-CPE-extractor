name: cpe-scanner

# Imagen y entorno comunes a api, worker y scanner (CLI).
x-app: &app
  build: ./backend
  image: cpe-scanner:local
  environment: &app-env
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    SCAN_USER: ${SCAN_USER:-}
    SCAN_PASSWORD: ${SCAN_PASSWORD:-}
    SCAN_USER_2: ${SCAN_USER_2:-}
    SCAN_PASSWORD_2: ${SCAN_PASSWORD_2:-}
  depends_on:
    db:
      condition: service_healthy
  # Endurecimiento comun: sin privilegios extra y sin escalar con setuid.
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin puertos publicados: solo accesible desde la red interna de compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    restart: unless-stopped
    entrypoint: ["uvicorn", "cpe_scanner.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
      # Opcional: token para scripts (rol admin). La web usa sesiones de usuario.
      API_TOKEN: ${API_TOKEN:-}
    read_only: true
    # Solo en localhost del servidor (/docs por tunel SSH). La web la consume por la red interna.
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *app-env
      SCAN_INTERVAL_MIN: ${SCAN_INTERVAL_MIN:-60}
    read_only: true

  web:
    build: ./frontend
    image: cpe-scanner-web:local
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Sin puertos: solo Caddy llega. Esta en las dos redes para alcanzar la API.
    networks: [default, edge]

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?definir SITE_HOST en .env (ej. 192.168.64.5)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # Solo la red edge: desde Caddy no se alcanza ni la API ni Postgres.
    networks: [edge]

  # Herramienta de linea de comandos: `docker compose run --rm scanner <comando>`.
  # El profile evita que `up -d` la arranque como servicio.
  scanner:
    <<: *app
    profiles: ["cli"]

networks:
  default:
  edge:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
